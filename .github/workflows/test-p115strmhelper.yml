name: Test 115 STRM V3

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        concurrenttools: ['0.1.8', '0.1.9']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install real p115client dependencies
        run: python -m pip install pytest 'p115client==0.0.9.6.5.1' 'python-concurrenttools==${{ matrix.concurrenttools }}'
      - name: Check real imports and concurrent APIs
        run: python -m pytest tests/dependencies -q
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout verified MoviePilot host contract
        uses: actions/checkout@v7
        with:
          repository: jxxghp/MoviePilot
          ref: 2e24c4063ff11eacd1f431708d906600d634046d
          path: .host-contract
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: python -m pip install pytest 'pydantic>=2,<3' 'httpx[http2]~=0.28.1' orjson 'fastapi~=0.141.1'
      - name: Test V3 compatibility boundaries
        env:
          MOVIEPILOT_SOURCE: ${{ github.workspace }}/.host-contract
        run: python -m pytest tests/p115strmhelper_v3 -q
      - name: Test 302 concurrency
        run: python -m unittest discover -s plugins.v3/p115strmhelper/tests -p test_r302_concurrency.py -q
      - name: Compile plugin source
        run: python -m compileall -q plugins.v3/p115strmhelper
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/p115strmhelper/package-lock.json
      - name: Build V3 frontend
        working-directory: frontend/p115strmhelper
        env:
          MP_PLUGIN_V3: '1'
        run: |
          npm ci --ignore-scripts
          node --test tests/*.test.js
          npm run build
      - name: Validate newly built federation CSS
        run: |
          python -c "from pathlib import Path; import shutil; p=Path('plugins.v3/p115strmhelper/dist'); shutil.rmtree(p); shutil.copytree('frontend/p115strmhelper/dist', p)"
          python .github/scripts/check_federation_css.py
