name: Test 115 STRM V3

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: python -m pip install pytest 'pydantic>=2,<3'
      - name: Test V3 compatibility boundaries
        run: python -m pytest tests/p115strmhelper_v3 -q
      - name: Test 302 concurrency
        run: python -m unittest discover -s plugins.v3/p115strmhelper/tests -p test_r302_concurrency.py -q
      - name: Compile plugin source
        run: python -m compileall -q plugins.v3/p115strmhelper
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/p115strmhelper/package-lock.json
      - name: Build V3 frontend
        working-directory: frontend/p115strmhelper
        env:
          MP_PLUGIN_V3: '1'
        run: |
          npm ci --ignore-scripts
          npm run build
